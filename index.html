<style>
:root{color-scheme:dark;--bg:#13151b;--panel:#20232b;--text:#f0ede8;--muted:#b3b5c1;--line:#393d49;--accent:#d6bb91;font-family:"Segoe UI","Malgun Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text)}
body{user-select:none;-webkit-user-select:none}button,input{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:5px}::selection{background:var(--accent);color:var(--bg)}
#stage{position:absolute;inset:0;touch-action:none;background:radial-gradient(ellipse at 50% 47%,#292b35 0%,#1b1e26 40%,#13151b 78%)}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;z-index:2;top:calc(26px + env(safe-area-inset-top));left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}h1{font-family:Georgia,"Batang",serif;font-weight:400;font-size:25px;margin:0;letter-spacing:.08em}header p{margin:7px 0 0;color:var(--muted);font-size:12px;letter-spacing:.1em}.tools{display:flex;gap:8px;pointer-events:auto}.tool{width:44px;height:44px;background:#191c24;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:background .2s,border-color .2s}.tool:hover,.tool[aria-pressed=true]{background:#30313a;border-color:var(--accent)}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
footer{position:absolute;z-index:2;bottom:calc(22px + env(safe-area-inset-bottom));left:24px;right:24px;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}footer span{display:block;margin-top:8px;color:#d6bb91;font-size:11px;letter-spacing:.1em}
#welcome{position:absolute;z-index:3;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;width:min(360px,90vw)}#welcome p{font-size:13px;color:var(--muted);margin:0 0 17px;line-height:1.7}.primary{background:var(--accent);color:#242028;border:0;border-radius:28px;min-height:50px;padding:0 32px;font-weight:600;box-shadow:0 8px 30px #0003;transition:background .2s,transform .2s}.primary:hover{background:#ead2ac;transform:translateY(-2px)}.primary:disabled{cursor:wait;opacity:.65;transform:none}
#message{position:absolute;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);max-width:90vw;width:360px;text-align:center;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}#message p{line-height:1.7;font-size:14px;color:var(--muted)}#message label{display:inline-block;padding:12px 20px;background:var(--accent);color:#242028;border-radius:24px;cursor:pointer}#file{position:absolute;width:1px;height:1px;opacity:0}#loading{position:absolute;z-index:2;top:48%;left:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:13px;text-align:center}progress{display:block;width:170px;height:3px;margin:15px auto;accent-color:var(--accent)}
#panel{position:absolute;z-index:5;top:calc(85px + env(safe-area-inset-top));right:24px;bottom:calc(65px + env(safe-area-inset-bottom));width:310px;max-width:calc(100vw - 32px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 16px 48px #0005;scrollbar-width:thin;scrollbar-color:#6a5e4d var(--panel)}#panel h2{font-size:17px;margin:0 0 8px;font-weight:600}#panel p{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 20px}#panel h3{font-size:13px;font-weight:600;margin:24px 0 14px;padding-top:18px;border-top:1px solid var(--line)}.setting{display:block;font-size:12px;margin:15px 0}.setting span{display:flex;justify-content:space-between;gap:10px}.setting output{color:var(--accent);font-variant-numeric:tabular-nums}.setting input{width:100%;margin:10px 0 0;accent-color:var(--accent);touch-action:pan-x}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;margin:12px 0}.row input{accent-color:var(--accent);width:17px;height:17px}.row small{color:var(--muted)}.secondary{background:transparent;border:1px solid var(--line);border-radius:20px;padding:9px 16px;font-size:12px}.secondary:hover{border-color:var(--accent)}#layers .row{font-size:11px}#layers label{display:flex;align-items:center;gap:9px}#stats{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;margin-top:18px}[hidden]{display:none!important}
@media(max-width:600px){header{left:20px;right:20px;top:calc(18px + env(safe-area-inset-top))}h1{font-size:21px}header p{font-size:11px}.tool{width:40px;height:40px}#panel{right:16px}footer{font-size:11px;bottom:calc(18px + env(safe-area-inset-bottom))}#welcome{bottom:calc(82px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){button{transition:none!important}}
</style>
<script>
// ━━━ 한국어 CONFIG: 이곳의 숫자만 바꾸면 효과를 조절할 수 있습니다. ━━━
const CONFIG = {
  파일: { PSD: './assets/riana.psd', 최대용량MB: 64 },
  화면: { 여백: 0.06, 최대해상도배율: 2, 디버그: false },
  숨쉬기: { 세기: 0.0045, 주기: 3.6, 머리따라가기: 0.75 },
  시선: { 세기: 1, 반응속도: 9 },
  깜빡임: { 최소간격: 2, 최대간격: 6, 시간: 0.15 },
  고개: { 각도: 1.8, 시차: 4, 반응속도: 4 },
  머리카락: { 세기: 1, 스프링: 35, 감쇠: 8, 살랑임: 0.6 },
  눌림: { 세기: 13, 반경: 85, 드래그: 0.35, 최대끌림: 48, 스프링: 95, 감쇠: 10,
    // topwear 경계 안의 상대 좌표 (0~1). 캐릭터가 바뀌면 조절하세요.
    가슴중심: [{ x: 0.27, y: 0.41 }, { x: 0.72, y: 0.26 }], 가슴반경: 90, 가슴관성: 0.65 },
  음악: { 음량: 0.32 },
};
</script>
</head>
<body>
<main id="stage" aria-label="마우스와 터치에 반응하는 리아나 캐릭터"></main>
<header><div><h1>리아나</h1><p>조용히, 당신의 곁에</p></div><div class="tools">
<button class="tool" id="sound" aria-label="배경음악 켜기" aria-pressed="false" title="배경음악"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg></button>
<button class="tool" id="settings" aria-label="효과 설정 열기" aria-expanded="false" aria-controls="panel" title="효과 설정"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#191c24"/><circle cx="15" cy="17" r="3" fill="#191c24"/></svg></button>
</div></header>
<div id="loading" role="status">리아나를 불러오는 중<progress id="progress"></progress></div>
<div id="message" hidden role="alert"><strong>캐릭터를 불러오지 못했어요</strong><p id="errorText"></p><label for="file" tabindex="0">PSD 파일 선택</label><input type="file" id="file" accept=".psd"><p>파일은 이 브라우저에서만 읽습니다.</p><button class="secondary" id="retry">다시 불러오기</button></div>
<div id="welcome"><p id="intro">잠깐의 여유를 함께해요.</p><button id="start" class="primary" disabled>불러오는 중…</button></div>
<footer id="hint">마우스를 움직여 눈을 맞춰보세요<span>옷을 누르거나 살짝 끌어보세요</span></footer>
<aside id="panel" hidden aria-label="효과 설정"><h2>움직임 조절</h2><p>작은 변화로 다른 분위기를 만들어보세요.</p><div id="controls"></div><button class="secondary" id="reset">기본값으로 돌아가기</button><h3>디버그</h3><label class="row">레이어 목록 보기<input id="debug" type="checkbox"></label><div id="layers" hidden></div><div id="stats"></div></aside>
<script>
'use strict';
const $ = id => document.getElementById(id);
const DEFAULTS = structuredClone(CONFIG);
const TOP_ORDER = ['front hair','irides-l','irides-r','eyewhite-l','eyewhite-r','eyelash-l','eyelash-r','eyebrow-r','topwear','mouth','eyebrow-l','nose','face','handwear-l','tail','ears-l','handwear-r','ears-r','neck','back hair'];
const BODY = new Set(['neck','topwear','handwear-l','handwear-r']);
const HAIR = new Set(['front hair','back hair','tail']);
const BACK = new Set(['back hair','tail']);
const HEAD = new Set(['face','ears-l','ears-r','eyewhite-l','eyewhite-r','irides-l','irides-r','eyelash-l','eyelash-r','eyebrow-l','eyebrow-r','nose','mouth','front hair']);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const lerp = (a,b,t) => a+(b-a)*t;
let app,world,psd,records=[],byName=new Map(),masks=[],started=false,loading=false,loadSequence=0;
let time=0,head={x:0,y:0},gaze={x:0,y:0},pointer={x:0,y:0},nextBlink=3,blinkStart=-100;
let bounds={left:0,top:0,right:1024,bottom:1024},anchor={x:512,y:410};
let press=null,pressSpring={x:0,y:0,z:0,vx:0,vy:0,vz:0},chest=[];
let audioContext,master,musicOn=false,musicTimer,nextNote=0,noteIndex=0;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

function loadScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');const fail=()=>{clearTimeout(timer);s.remove();reject(new Error('라이브러리 CDN 연결을 확인한 뒤 다시 불러오기를 눌러주세요.'));};const timer=setTimeout(fail,20000);s.src=url;s.onload=()=>{clearTimeout(timer);resolve();};s.onerror=fail;document.head.appendChild(s);});}
let libraries;
function ensureLibraries(){return libraries||=(Promise.all([
  window.PIXI?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js'),
  window.agPsd?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/ag-psd@27.0.0/dist/bundle.js')
]).catch(error=>{libraries=null;throw error;}));}

function spring(state,key,target,k,d,dt){const velocity='v'+key;state[velocity]+=(k*(target-state[key])-d*state[velocity])*dt;state[key]+=state[velocity]*dt;}
function clearModel(){if(!world)return;for(const r of records)r.mesh.mask=null;world.removeChildren().forEach(c=>c.destroy({children:true,texture:false,baseTexture:false}));for(const m of masks)m.texture.destroy(true);for(const r of records)r.texture.destroy(true);records=[];byName.clear();masks=[];press=null;chest=[];}
function flatten(children,result=[]){for(const layer of children||[]){if(layer.children)flatten(layer.children,result);else if(layer.canvas?.width&&layer.canvas?.height)result.push(layer);}return result;}

function buildModel(documentPSD){
  clearModel();psd=documentPSD;
  // ag-psd children은 아래→위 순서. 일반 레이어의 자리는 그대로 두고 눈 자리만 교환합니다.
  const layers=flatten(psd.children);
  const eyeIndices=layers.map((l,i)=>/^(eyewhite|irides|eyelash)-[lr]$/.test(l.name.trim().toLowerCase())?i:-1).filter(i=>i>=0);
  const rank=name=>name.startsWith('eyewhite')?0:name.startsWith('irides')?1:2;
  const eyeLayers=eyeIndices.map(i=>layers[i]).sort((a,b)=>rank(a.name)-rank(b.name));
  eyeIndices.forEach((slot,i)=>layers[slot]=eyeLayers[i]);
  for(const layer of layers){
    const name=layer.name.trim().toLowerCase(),texture=PIXI.Texture.from(layer.canvas);
    const columns=name==='topwear'?27:HAIR.has(name)?15:BODY.has(name)?9:5;
    const rows=name==='topwear'?27:HAIR.has(name)?23:BODY.has(name)?11:5;
    const mesh=new PIXI.SimplePlane(texture,columns,rows);
    // 정점은 원본 PSD 좌표로 이동하고 텍스처 UV는 그대로 유지합니다.
    const buffer=mesh.geometry.getBuffer('aVertexPosition'),base=new Float32Array(buffer.data.length);
    for(let i=0;i<base.length;i+=2){base[i]=buffer.data[i]+(layer.left||0);base[i+1]=buffer.data[i+1]+(layer.top||0);}
    buffer.data.set(base);buffer.update();mesh.autoResize=false;mesh.alpha=layer.opacity??1;mesh.visible=!layer.hidden;mesh.eventMode='none';world.addChild(mesh);
    const pixels=layer.canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,layer.canvas.width,layer.canvas.height);
    const record={name,layer,texture,mesh,buffer,base,pixels,enabled:!layer.hidden,hair:{x:0,y:0,vx:0,vy:0}};
    records.push(record);byName.set(name,record);
  }
  if(!records.length)throw new Error('표시할 이미지 레이어가 없는 PSD입니다.');
  bounds={left:Math.min(...records.map(r=>r.layer.left)),top:Math.min(...records.map(r=>r.layer.top)),right:Math.max(...records.map(r=>r.layer.right)),bottom:Math.max(...records.map(r=>r.layer.bottom))};
  const face=byName.get('face')?.layer;
  anchor={x:face?(face.left+face.right)/2:psd.width/2,y:face?face.bottom-18:psd.height*.4};
  for(const side of ['l','r']){
    const white=byName.get('eyewhite-'+side),iris=byName.get('irides-'+side);
    if(!white||!iris)continue;
    // SpriteMaskFilter는 실제 흰자 alpha를 사용합니다. 사각형 근사 마스크가 아닙니다.
    const maskCanvas=document.createElement('canvas');maskCanvas.width=white.pixels.width;maskCanvas.height=white.pixels.height;
    const alpha=new ImageData(new Uint8ClampedArray(white.pixels.data),white.pixels.width,white.pixels.height);
    for(let i=0;i<alpha.data.length;i+=4)alpha.data[i]=alpha.data[i+1]=alpha.data[i+2]=255;
    maskCanvas.getContext('2d').putImageData(alpha,0,0);
    const texture=PIXI.Texture.from(maskCanvas),mask=new PIXI.Sprite(texture);world.addChild(mask);iris.mesh.mask=mask;masks.push({sprite:mask,texture,white,iris,side});
  }
  const top=byName.get('topwear')?.layer;
  chest=top?CONFIG.눌림.가슴중심.map(p=>({cx:top.left+(top.right-top.left)*p.x,cy:top.top+(top.bottom-top.top)*p.y,x:0,y:0,vx:0,vy:0})):[];
  time=0;nextBlink=randomBlink();blinkStart=-100;head={x:0,y:0};gaze={x:0,y:0};pressSpring={x:0,y:0,z:0,vx:0,vy:0,vz:0};
  resize();createLayerControls();updateModel(0);app.render();
  const missing=TOP_ORDER.filter(n=>!byName.has(n));
  $('stats').textContent=`${records.length}개 레이어 · ${psd.width} × ${psd.height}${missing.length?' · 누락: '+missing.join(', '):''}`;
  window.character={config:CONFIG,app,world,records,byName,masks,get started(){return started;},get press(){return press;},get time(){return time;},get blink(){return blinkValue();}};
}
function resize(){if(!app||!psd)return;const width=innerWidth,height=innerHeight;app.renderer.resize(width,height);const gap=width<600?100:105,bottom=started?76:160;const availableH=Math.max(120,height-gap-bottom);const scale=Math.min(width*(1-CONFIG.화면.여백*2)/(bounds.right-bounds.left+30),availableH/(bounds.bottom-bounds.top+35));world.scale.set(scale);world.position.set(width/2-(bounds.left+bounds.right)/2*scale,gap+availableH/2-(bounds.top+bounds.bottom)/2*scale);if(!started)app.render();}
function randomBlink(){const a=Math.max(.2,CONFIG.깜빡임.최소간격),b=Math.max(a,CONFIG.깜빡임.최대간격);return a+Math.random()*(b-a);}
function blinkValue(){const phase=(time-blinkStart)/Math.max(.05,CONFIG.깜빡임.시간);return phase>=0&&phase<1?Math.sin(phase*Math.PI)**2:0;}
function headPoint(x,y,angle,dx,dy){const c=Math.cos(angle),s=Math.sin(angle);return {x:anchor.x+(x-anchor.x)*c-(y-anchor.y)*s+dx,y:anchor.y+(x-anchor.x)*s+(y-anchor.y)*c+dy};}
function groupTransform(name,breath){const isHead=HEAD.has(name),isBack=BACK.has(name);const factor=name==='front hair'?1.15:isBack?.45:1;return {angle:(head.x*CONFIG.고개.각도*Math.PI/180)*factor,dx:head.x*CONFIG.고개.시차*factor,dy:(isHead||isBack?breath*CONFIG.숨쉬기.머리따라가기:0)+head.y*CONFIG.고개.시차*.3*factor};}
function updateModel(dt){
  const smoothing=1-Math.exp(-CONFIG.고개.반응속도*dt),eyeSmooth=1-Math.exp(-CONFIG.시선.반응속도*dt);
  head.x=lerp(head.x,pointer.x,smoothing);head.y=lerp(head.y,pointer.y,smoothing);gaze.x=lerp(gaze.x,pointer.x,eyeSmooth);gaze.y=lerp(gaze.y,pointer.y,eyeSmooth);
  if(time>=nextBlink){blinkStart=time;nextBlink=time+randomBlink();}
  const blink=blinkValue(),open=1-blink*.97,breathScale=1+Math.sin(time*Math.PI*2/Math.max(.5,CONFIG.숨쉬기.주기))*CONFIG.숨쉬기.세기;
  const breath=-(bounds.bottom-anchor.y)*(breathScale-1);
  const steps=Math.max(1,Math.ceil(dt/(1/120))),step=dt/steps;
  for(let s=0;s<steps;s++){
    spring(pressSpring,'x',press?.active?press.dx:0,CONFIG.눌림.스프링,CONFIG.눌림.감쇠,step);
    spring(pressSpring,'y',press?.active?press.dy:0,CONFIG.눌림.스프링,CONFIG.눌림.감쇠,step);
    spring(pressSpring,'z',press?.active?1:0,CONFIG.눌림.스프링,CONFIG.눌림.감쇠,step);
    for(const r of records)if(HAIR.has(r.name)){
      const scale=r.name==='tail'?1.4:r.name==='front hair'?.7:1;
      spring(r.hair,'x',head.x*scale,CONFIG.머리카락.스프링,CONFIG.머리카락.감쇠,step);
      spring(r.hair,'y',head.y*scale,CONFIG.머리카락.스프링,CONFIG.머리카락.감쇠,step);
    }
    for(const c of chest){const influence=press?Math.exp(-((c.cx-press.x)**2+(c.cy-press.y)**2)/(CONFIG.눌림.가슴반경**2*2)):0;
      spring(c,'x',pressSpring.x*influence*CONFIG.눌림.가슴관성,CONFIG.눌림.스프링*.55,CONFIG.눌림.감쇠*.7,step);
      spring(c,'y',(pressSpring.y+pressSpring.z*CONFIG.눌림.세기*.65)*influence*CONFIG.눌림.가슴관성,CONFIG.눌림.스프링*.55,CONFIG.눌림.감쇠*.7,step);
    }
  }
  for(const r of records){const {name,layer,base,buffer}=r;const transform=groupTransform(name,breath);const white=byName.get('eyewhite-'+name.slice(-1))?.layer;
    const eyeBottom=white?.bottom||layer.bottom;
    let gx=0,gy=0;if(name.startsWith('irides')&&white){gx=clamp(gaze.x*CONFIG.시선.세기*(white.right-white.left)*.18,Math.min(0,white.left-layer.left),Math.max(0,white.right-layer.right));gy=clamp(gaze.y*CONFIG.시선.세기*(white.bottom-white.top)*.16,Math.min(0,white.top-layer.top),Math.max(0,white.bottom-layer.bottom));}
    for(let i=0;i<base.length;i+=2){let x=base[i],y=base[i+1];
      if(BODY.has(name))y=bounds.bottom+(y-bounds.bottom)*breathScale;
      if(name.startsWith('irides')){x+=gx;y+=gy;}
      if(/^(eyewhite|irides)-/.test(name))y=eyeBottom+(y-eyeBottom)*open;
      if(name.startsWith('eyelash')&&white){const center=(layer.top+layer.bottom)/2;y=center+(y-center)*(1-.88*blink)+(eyeBottom-center)*blink;}
      if(name==='topwear'&&press){
        const radius=Math.max(15,CONFIG.눌림.반경),rx=x-press.x,ry=y-press.y,influence=Math.exp(-(rx*rx+ry*ry)/(radius*radius));
        //  눌린 지점 주변을 안으로 모으고, 아래로 움푹 들어가게 합니다.
        x+=influence*(pressSpring.x-rx/radius*pressSpring.z*CONFIG.눌림.세기*.5);
        y+=influence*(pressSpring.y+pressSpring.z*CONFIG.눌림.세기-ry/radius*pressSpring.z*CONFIG.눌림.세기*.45);
        for(const c of chest){const weight=Math.exp(-((base[i]-c.cx)**2+(base[i+1]-c.cy)**2)/(CONFIG.눌림.가슴반경**2));x+=c.x*weight;y+=c.y*weight;}
      }
      if(HEAD.has(name)||BACK.has(name)){
        if(HAIR.has(name)){const free=clamp((base[i+1]-layer.top)/(layer.bottom-layer.top),0,1)**1.7;const wave=Math.sin(time*1.65+base[i+1]*.009+(name==='tail'?1:0));x+=free*((r.hair.x-head.x)*12+wave*CONFIG.머리카락.살랑임*2)*CONFIG.머리카락.세기;y+=free*r.hair.y*2*CONFIG.머리카락.세기;}
        const p=headPoint(x,y,transform.angle,transform.dx,transform.dy);x=p.x;y=p.y;
      }
      buffer.data[i]=x;buffer.data[i+1]=y;
    }
    buffer.update();r.mesh.visible=r.enabled;
  }
  for(const {sprite,white} of masks){const layer=white.layer,tr=groupTransform(white.name,breath);const p=headPoint(layer.left,layer.bottom,tr.angle,tr.dx,tr.dy);sprite.pivot.set(0,layer.bottom-layer.top);sprite.position.set(p.x,p.y);sprite.scale.set(1,open);sprite.rotation=tr.angle;}
}

function modelPoint(event){const rect=app.view.getBoundingClientRect();return world.toLocal(new PIXI.Point((event.clientX-rect.left)*app.screen.width/rect.width,(event.clientY-rect.top)*app.screen.height/rect.height));}
function movePointer(event){if(!psd)return;const p=modelPoint(event);pointer.x=clamp((p.x-anchor.x)/(psd.width*.4),-1,1);pointer.y=clamp((p.y-anchor.y)/(psd.height*.4),-1,1);if(press?.active&&event.pointerId===press.id){press.dx=clamp((p.x-press.x)*CONFIG.눌림.드래그,-CONFIG.눌림.최대끌림,CONFIG.눌림.최대끌림);press.dy=clamp((p.y-press.y)*CONFIG.눌림.드래그,-CONFIG.눌림.최대끌림,CONFIG.눌림.최대끌림);}}
// 실제로 변형된 mesh의 삼각형과 UV로 알파 히트테스트: 투명한 부분은 눌리지 않습니다.
function hitTopwear(p){const r=byName.get('topwear');if(!r?.enabled)return false;const vertices=r.buffer.data,uv=r.mesh.geometry.getBuffer('aTextureCoord').data,indices=r.mesh.geometry.getIndex().data;
  for(let n=0;n<indices.length;n+=3){const a=indices[n]*2,b=indices[n+1]*2,c=indices[n+2]*2;const ax=vertices[a],ay=vertices[a+1],bx=vertices[b],by=vertices[b+1],cx=vertices[c],cy=vertices[c+1];const det=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);if(Math.abs(det)<1e-7)continue;const wa=((by-cy)*(p.x-cx)+(cx-bx)*(p.y-cy))/det,wb=((cy-ay)*(p.x-cx)+(ax-cx)*(p.y-cy))/det,wc=1-wa-wb;if(wa<0||wb<0||wc<0)continue;const u=uv[a]*wa+uv[b]*wb+uv[c]*wc,v=uv[a+1]*wa+uv[b+1]*wb+uv[c+1]*wc;const px=clamp(Math.floor(u*r.pixels.width),0,r.pixels.width-1),py=clamp(Math.floor(v*r.pixels.height),0,r.pixels.height-1);return r.pixels.data[(py*r.pixels.width+px)*4+3]>30;}
  return false;
}
function release(event){if(press?.active&&event.pointerId===press.id){press.active=false;try{app.view.releasePointerCapture(event.pointerId);}catch{}app.view.style.cursor='default';}if(event.pointerType==='touch')pointer={x:0,y:0};}
function bindPointer(){const canvas=app.view;canvas.addEventListener('pointermove',movePointer);canvas.addEventListener('pointerdown',event=>{if(!started){startExperience();return;}if(press?.active)return;movePointer(event);const p=modelPoint(event);if(hitTopwear(p)){press={id:event.pointerId,x:p.x,y:p.y,dx:0,dy:0,active:true};canvas.setPointerCapture(event.pointerId);canvas.style.cursor='grabbing';}});canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);canvas.addEventListener('pointerleave',()=>{if(!press?.active)pointer={x:0,y:0};});}

async function init(buffer){const sequence=++loadSequence;loading=true;$('message').hidden=true;$('loading').hidden=false;$('start').disabled=true;
  try{await ensureLibraries();if(sequence!==loadSequence)return;
    if(!app){if(!PIXI.utils.isWebGLSupported())throw new Error('WebGL을 사용할 수 없습니다. 브라우저의 하드웨어 가속을 켜주세요.');app=new PIXI.Application({width:innerWidth,height:innerHeight,backgroundAlpha:0,antialias:true,autoDensity:true,resolution:Math.min(devicePixelRatio||1,CONFIG.화면.최대해상도배율),autoStart:false});world=new PIXI.Container();app.stage.addChild(world);$('stage').appendChild(app.view);bindPointer();app.ticker.add(()=>{if(!psd||!started)return;const dt=Math.min(app.ticker.deltaMS/1000,1/30);time+=dt;updateModel(dt);});}
    if(!buffer){const response=await fetch(CONFIG.파일.PSD);if(!response.ok)throw new Error(`PSD 경로를 확인해주세요 (${response.status}).`);const limit=CONFIG.파일.최대용량MB*1024*1024;const size=Number(response.headers.get('content-length'));if(size>limit)throw new Error('PSD 파일이 용량 제한을 초과했습니다.');if(response.body){const reader=response.body.getReader(),chunks=[];let loaded=0;while(true){const {done,value}=await reader.read();if(done)break;loaded+=value.length;if(loaded>limit){await reader.cancel();throw new Error('PSD 파일이 용량 제한을 초과했습니다.');}chunks.push(value);if(size){$('progress').max=size;$('progress').value=loaded;}}const data=new Uint8Array(loaded);let offset=0;for(const chunk of chunks){data.set(chunk,offset);offset+=chunk.length;}buffer=data.buffer;}else buffer=await response.arrayBuffer();}
    if(sequence!==loadSequence)return;
    const documentPSD=agPsd.readPsd(buffer,{skipCompositeImageData:true,skipThumbnail:true});buildModel(documentPSD);
    $('loading').hidden=true;$('start').disabled=false;$('start').textContent='탭하여 시작';if(started){app.start();$('welcome').hidden=true;}else $('welcome').hidden=false;
  }catch(error){if(sequence!==loadSequence)return;console.error(error);$('loading').hidden=true;$('message').hidden=false;$('errorText').textContent=location.protocol==='file:'?'파일을 직접 열었을 때는 PSD 파일을 선택해주세요. 또는 HTTP 서버에서 실행해주세요.':error.message;$('start').textContent='불러오기 필요';}
  finally{if(sequence===loadSequence)loading=false;}
}
function startExperience(){if(!psd||loading)return;started=true;$('welcome').hidden=true;resize();app.start();setMusic(true).catch(error=>{$('stats').textContent='음악을 재생할 수 없습니다: '+error.message;});}

// 별도 파일 없는 조용한 Web Audio BGM. 사용자 탭 안에서 AudioContext를 시작합니다.
function scheduleMusic(){if(!musicOn||!audioContext||audioContext.state!=='running')return;const chords=[[130.81,164.81,196,246.94],[110,130.81,164.81,196],[87.31,130.81,174.61,220],[98,146.83,196,246.94]];while(nextNote<audioContext.currentTime+2){const chord=chords[Math.floor(noteIndex/8)%chords.length],frequency=chord[[0,2,1,3,2,1,3,2][noteIndex%8]]*(noteIndex%3===0?2:1);const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,nextNote);gain.gain.linearRampToValueAtTime(.075,nextNote+.15);gain.gain.exponentialRampToValueAtTime(.0001,nextNote+3.5);oscillator.connect(gain);gain.connect(master);oscillator.start(nextNote);oscillator.stop(nextNote+3.6);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};nextNote+=.7;noteIndex++;}}
async function setMusic(on){if(on&&!audioContext){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('이 브라우저는 Web Audio를 지원하지 않습니다.');audioContext=new Audio();master=audioContext.createGain();master.gain.value=0;master.connect(audioContext.destination);}
  if(on){await audioContext.resume();musicOn=true;nextNote=Math.max(nextNote,audioContext.currentTime+.05);master.gain.setTargetAtTime(CONFIG.음악.음량,audioContext.currentTime,.25);scheduleMusic();clearInterval(musicTimer);musicTimer=setInterval(scheduleMusic,500);}else{musicOn=false;clearInterval(musicTimer);if(master)master.gain.setTargetAtTime(0,audioContext.currentTime,.15);}
  $('sound').setAttribute('aria-pressed',String(on));$('sound').setAttribute('aria-label',on?'배경음악 끄기':'배경음악 켜기');
}
function createControls(){const definitions=[['숨쉬기','세기','숨쉬기 세기',0,.012,.0005],['숨쉬기','주기','숨쉬기 주기 (초)',2,7,.1],['시선','세기','시선 이동',0,2,.1],['깜빡임','최소간격','깜빡임 최소 간격 (초)',1,6,.1],['깜빡임','최대간격','깜빡임 최대 간격 (초)',2,10,.1],['깜빡임','시간','깜빡임 시간 (초)',.08,.4,.01],['고개','각도','고개 기울기 (도)',0,5,.1],['고개','시차','고개 시차',0,10,.5],['머리카락','세기','머리카락 움직임',0,2,.1],['머리카락','살랑임','머리카락 살랑임',0,2,.1],['머리카락','스프링','머리카락 탄성',10,80,1],['머리카락','감쇠','머리카락 감쇠',3,18,.5],['눌림','세기','눌림 깊이',0,30,1],['눌림','반경','눌림 범위',30,150,5],['눌림','드래그','끌림 세기',0,.8,.05],['눌림','스프링','옷의 탄성',30,160,5],['눌림','감쇠','옷의 감쇠',3,20,.5],['눌림','가슴관성','가슴 관성',0,1.5,.05],['음악','음량','음악 음량',0,.7,.01]];
  $('controls').replaceChildren();for(const [group,key,title,min,max,step] of definitions){const label=document.createElement('label');label.className='setting';const span=document.createElement('span'),text=document.createElement('span'),output=document.createElement('output'),input=document.createElement('input');text.textContent=title;output.value=CONFIG[group][key];input.type='range';input.min=min;input.max=max;input.step=step;input.value=CONFIG[group][key];input.id=`control-${group}-${key}`;output.htmlFor=input.id;span.append(text,output);label.append(span,input);input.addEventListener('input',()=>{CONFIG[group][key]=Number(input.value);output.value=input.value;if(group==='깜빡임')nextBlink=time+randomBlink();if(group==='음악'&&master&&musicOn)master.gain.setTargetAtTime(CONFIG.음악.음량,audioContext.currentTime,.1);});$('controls').append(label);}
}
function createLayerControls(){$('layers').replaceChildren();for(const r of [...records].reverse()){const row=document.createElement('div');row.className='row';const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span'),coords=document.createElement('small');input.type='checkbox';input.checked=r.enabled;text.textContent=r.name;coords.textContent=`${r.layer.left}, ${r.layer.top}`;label.append(input,text);row.append(label,coords);input.addEventListener('change',()=>{r.enabled=input.checked;r.mesh.visible=r.enabled;if(!started)app.render();});$('layers').append(row);}}
$('start').addEventListener('click',startExperience);$('sound').addEventListener('click',()=>{if(!started){startExperience();return;}setMusic(!musicOn).catch(error=>{$('stats').textContent=error.message;});});
$('settings').addEventListener('click',()=>{const show=$('panel').hidden;$('panel').hidden=!show;$('settings').setAttribute('aria-expanded',String(show));$('settings').setAttribute('aria-label',show?'효과 설정 닫기':'효과 설정 열기');});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){$('panel').hidden=true;$('settings').setAttribute('aria-expanded','false');$('settings').focus();}});
$('debug').checked=CONFIG.화면.디버그;$('layers').hidden=!CONFIG.화면.디버그;$('debug').addEventListener('change',()=>{CONFIG.화면.디버그=$('debug').checked;$('layers').hidden=!$('debug').checked;});
$('reset').addEventListener('click',()=>{for(const group of Object.keys(DEFAULTS))Object.assign(CONFIG[group],structuredClone(DEFAULTS[group]));for(const r of records)r.enabled=!r.layer.hidden;createControls();createLayerControls();nextBlink=time+randomBlink();$('debug').checked=CONFIG.화면.디버그;$('layers').hidden=!CONFIG.화면.디버그;if(master&&musicOn)master.gain.setTargetAtTime(CONFIG.음악.음량,audioContext.currentTime,.1);if(psd){updateModel(0);app.render();}});
$('file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;if(file.size>CONFIG.파일.최대용량MB*1024*1024){$('errorText').textContent='PSD 파일이 용량 제한을 초과했습니다.';return;}await init(await file.arrayBuffer());});
document.querySelector('label[for=file]').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();$('file').click();}});
$('retry').addEventListener('click',()=>init());addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden){app?.stop();if(press)press.active=false;audioContext?.suspend();}else{if(started){app?.start();if(musicOn)audioContext?.resume().then(()=>{nextNote=audioContext.currentTime+.05;});}}});
document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});document.addEventListener('wheel',event=>{if(event.ctrlKey||!event.target.closest('#panel'))event.preventDefault();},{passive:false});
if(reducedMotion){CONFIG.숨쉬기.세기*=.4;CONFIG.고개.각도*=.4;CONFIG.머리카락.살랑임*=.4;}
createControls();init();
</script>
