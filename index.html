<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#150d14">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<title>레이나 · 마사지</title>
<style>
:root{color-scheme:dark;--bg:#150d14;--panel:#22161f;--text:#f6eef2;--muted:#c3aebb;--line:#47303f;--accent:#f4a6c2;--love:#ff5c96;--love-soft:#ffb3cf;--calm:#7fdcc3;--calm-soft:#c4f2e4;--story:"Gowun Batang","Batang",serif;font-family:"Segoe UI","Malgun Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text)}
body{user-select:none;-webkit-user-select:none}button,input{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:5px}::selection{background:var(--accent);color:var(--bg)}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 45%,#33202d 0%,#1f141c 42%,#150d14 80%)}#stage canvas{position:relative;display:block;width:100%;height:100%;touch-action:none}
#sceneBlur{position:absolute;inset:-40px;pointer-events:none;background-position:center;background-size:cover;filter:blur(28px) brightness(.32) saturate(1.2);opacity:0;transition:opacity .5s}#scene{position:absolute;pointer-events:none;background-position:center;background-size:cover;background-repeat:no-repeat;transition:opacity .4s}
#bgPanel{position:absolute;z-index:5;top:calc(85px + env(safe-area-inset-top));right:24px;width:300px;max-width:calc(100vw - 32px);max-height:calc(100% - 160px);overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 16px 48px #0005}#bgPanel h2{font-size:17px;margin:0 0 6px;font-weight:600}#bgPanel p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 16px}
#bgList{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bg-option{padding:0;background:none;border:0;text-align:center;font-size:11px;color:var(--muted)}.bg-option i{display:block;aspect-ratio:4/3;margin-bottom:6px;border-radius:10px;border:1px solid var(--line);background-position:center;background-size:cover;background-color:#150d14}.bg-option[aria-pressed=true]{color:var(--text)}.bg-option[aria-pressed=true] i{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.bg-option:hover i{border-color:var(--accent)}.bg-option.none i{background-image:linear-gradient(135deg,transparent 46%,#47303f 46% 54%,transparent 54%)}
#bgUpload{display:inline-block;margin-top:16px;cursor:pointer}#bgFile{position:absolute;width:1px;height:1px;opacity:0}
#frame{position:absolute;z-index:1;border:1px solid #f4a6c230;border-radius:16px;pointer-events:none;overflow:hidden;box-shadow:inset 0 0 0 4px #150d1444}#frame::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(transparent,#150d1499)}
header{position:absolute;z-index:2;top:calc(26px + env(safe-area-inset-top));left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}h1{font-family:var(--story);font-weight:700;font-size:25px;margin:0;letter-spacing:.08em}header p{margin:7px 0 0;color:var(--muted);font-size:12px;letter-spacing:.1em}.tools{display:flex;gap:8px;pointer-events:auto}.tool{width:44px;height:44px;background:#1d121a;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:background .2s,border-color .2s}.tool:hover,.tool[aria-pressed=true]{background:#33202d;border-color:var(--accent)}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
footer{position:absolute;z-index:2;bottom:calc(22px + env(safe-area-inset-bottom));left:24px;right:24px;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}footer .sub{margin-top:8px;color:var(--accent);font-size:11px;letter-spacing:.1em}
#heat{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:radial-gradient(ellipse 72% 64% at 50% 52%,transparent 50%,#ff3d7f2e 76%,#ff2f7266 100%)}
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,#fff6fa 0%,#ffb3cf 45%,#ff5c96 100%)}
#hud{position:absolute;z-index:3;left:32px;top:50%;transform:translateY(-50%);width:212px;padding:16px 16px 14px;background:#1d121acc;border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;box-shadow:0 14px 36px #0007}
.gauge{margin-bottom:14px}.g-head{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:7px;color:var(--text)}.g-head svg{width:16px;height:16px;fill:currentColor;stroke:none;flex:none}.g-head output{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}.g-track{position:relative;height:10px;border-radius:10px;background:#ffffff12;overflow:hidden}.g-track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),#150d14bb calc(25% - 1px) 25%)}.g-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit}.g-stage{margin-top:6px;font-size:11px;letter-spacing:.06em}
#gArousal svg,#gArousal output{color:var(--love)}#gArousal .g-fill{background:linear-gradient(90deg,#ff9ec0,#ff4f8b 60%,#ff2a6d)}#gArousal .g-stage{color:var(--love-soft)}#gSatisfy svg,#gSatisfy output{color:var(--calm)}#gSatisfy .g-fill{background:linear-gradient(90deg,#c9f3e6,#6fd6b8 60%,#3fbf9c)}#gSatisfy .g-stage{color:var(--calm-soft)}.gauge.max .g-fill{animation:shine .7s ease-in-out infinite alternate}@keyframes shine{to{filter:brightness(1.3)}}
#stroke{padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.s-head{display:flex;justify-content:space-between;margin-bottom:7px}#strokeLabel{color:var(--text)}.s-track{position:relative;height:6px;border-radius:6px;background:#ffffff12}#strokeSweet{position:absolute;top:0;bottom:0;border-radius:6px;transition:left .35s ease-out,width .35s ease-out;background:#7fdcc340;box-shadow:inset 0 0 0 1px #7fdcc380}#strokeNeedle{position:absolute;top:-3px;left:0;width:3px;height:12px;border-radius:2px;background:var(--text);transform:translateX(-50%);transition:left .12s linear}#strokeNeedle.rough{background:#ff6b6b}#strokeNeedle.good{background:var(--calm)}
#dialog{position:absolute;z-index:3;left:50%;top:0;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));min-height:74px;padding:19px 22px 15px;background:linear-gradient(180deg,#26161fec,#1a1017f5);border:1px solid #f4a6c244;border-radius:14px;pointer-events:none;box-shadow:0 14px 36px #0008;transition:opacity .6s}#dialog.idle{opacity:.5}#dialog .name{position:absolute;top:-12px;left:18px;padding:3px 14px;border-radius:999px;background:var(--accent);color:#2a1020;font-size:12px;font-weight:700;letter-spacing:.12em}#dialogText{font-family:var(--story);font-size:16px;line-height:1.6;min-height:1.6em}#dialog .next{position:absolute;right:18px;bottom:12px;width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);animation:bob 1s ease-in-out infinite}@keyframes bob{50%{translate:0 3px}}
.pop{position:absolute;z-index:3;pointer-events:none;font-size:13px;font-weight:700;padding:3px 11px;border-radius:999px;white-space:nowrap;translate:-50% -100%}.pop.love{background:var(--love);color:#fff}.pop.calm{background:var(--calm);color:#0f2a23}.pop.rough{background:#3a1d24;color:#ff9a9a;border:1px solid #ff6b6b88}
#zoneTag{position:absolute;z-index:3;left:0;top:0;pointer-events:none;font-size:11px;padding:3px 10px;border-radius:999px;background:#1d121ae0;border:1px solid var(--line);white-space:nowrap}#zoneTag.love{color:var(--love-soft);border-color:#ff5c9666}#zoneTag.calm{color:var(--calm-soft);border-color:#7fdcc366}
@media(max-width:899px){#hud{top:calc(72px + env(safe-area-inset-top));left:16px;right:16px;transform:none;width:auto;display:grid;grid-template-columns:1fr 1fr;column-gap:16px;padding:12px 14px 11px}.gauge{margin-bottom:9px}#stroke{grid-column:1/-1;padding-top:9px}#dialogText{font-size:14px}#dialog{padding:17px 18px 13px;min-height:64px}}
#welcome{position:absolute;z-index:3;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;width:min(360px,90vw)}#welcome p{font-size:13px;color:var(--muted);margin:0 0 17px;line-height:1.7}.primary{background:var(--accent);color:#2a1020;border:0;border-radius:28px;min-height:50px;padding:0 32px;font-weight:600;box-shadow:0 8px 30px #0003;transition:background .2s,transform .2s}.primary:hover{background:#ffc3d8;transform:translateY(-2px)}.primary:disabled{cursor:wait;opacity:.65;transform:none}
#message{position:absolute;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);max-width:90vw;width:360px;text-align:center;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}#message p{line-height:1.7;font-size:14px;color:var(--muted)}#message label{display:inline-block;padding:12px 20px;background:var(--accent);color:#2a1020;border-radius:24px;cursor:pointer}#file{position:absolute;width:1px;height:1px;opacity:0}#loading{position:absolute;z-index:2;top:48%;left:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:13px;text-align:center}progress{display:block;width:170px;height:3px;margin:15px auto;accent-color:var(--accent)}
#panel{position:absolute;z-index:5;top:calc(85px + env(safe-area-inset-top));right:24px;bottom:calc(65px + env(safe-area-inset-bottom));width:310px;max-width:calc(100vw - 32px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 16px 48px #0005;scrollbar-width:thin;scrollbar-color:#7a4a63 var(--panel)}#panel h2{font-size:17px;margin:0 0 8px;font-weight:600}#panel p{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 20px}#panel h3{font-size:13px;font-weight:600;margin:24px 0 14px;padding-top:18px;border-top:1px solid var(--line)}.setting{display:block;font-size:12px;margin:15px 0}.setting span{display:flex;justify-content:space-between;gap:10px}.setting output{color:var(--accent);font-variant-numeric:tabular-nums}.setting input{width:100%;margin:10px 0 0;accent-color:var(--accent);touch-action:pan-y}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;margin:12px 0}.row input{accent-color:var(--accent);width:17px;height:17px}.row small{color:var(--muted)}.secondary{background:transparent;border:1px solid var(--line);border-radius:20px;padding:9px 16px;font-size:12px}.secondary:hover{border-color:var(--accent)}#layers .row{font-size:11px}#layers label{display:flex;align-items:center;gap:9px}#stats{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;margin-top:18px}[hidden]{display:none!important}
@media(max-width:600px){header{left:20px;right:20px;top:calc(18px + env(safe-area-inset-top))}h1{font-size:21px}header p{font-size:11px}.tool{width:40px;height:40px}#panel,#bgPanel{right:16px}footer{font-size:11px;bottom:calc(18px + env(safe-area-inset-bottom))}#welcome{bottom:calc(82px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){button{transition:none!important}}
#toolbar{position:absolute;z-index:3;left:32px;width:212px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 10px;background:#1d121acc;border:1px solid var(--line);border-radius:12px;font-size:12px;transition:background .2s,border-color .2s}.tbtn svg{width:16px;height:16px;flex:none}.tbtn:hover{border-color:var(--accent)}.tbtn[aria-pressed=true]{background:#3a2231;border-color:var(--accent)}#toolOil[aria-pressed=true]{background:#3a2a1c;border-color:#f2c27a}
#request{position:absolute;z-index:3;transform:translateX(-50%);width:max-content;min-width:220px;max-width:min(360px,calc(100vw - 48px));padding:9px 14px 10px;background:#1d121ae8;border:1px solid #7fdcc366;border-radius:12px;pointer-events:none;box-shadow:0 10px 26px #0007}#request.love{border-color:#ff5c9666}.r-head{display:flex;gap:8px;align-items:baseline;font-size:13px}.r-head span{color:var(--calm);font-weight:700;font-size:11px}#request.love .r-head span{color:var(--love)}#requestText{font-weight:600}.r-track{position:relative;height:4px;margin-top:8px;border-radius:4px;background:#ffffff14;overflow:hidden}#requestTime{position:absolute;inset:0 auto 0 0;background:#ffffff2a}#requestFill{position:absolute;inset:0 auto 0 0;background:var(--calm)}#request.love #requestFill{background:var(--love)}
#timer{position:absolute;z-index:3;padding:5px 11px;border-radius:999px;background:#1d121ae0;border:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}#timer.low{color:#ffb070;border-color:#ffb07088}
#toast{position:absolute;z-index:8;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:9px 16px;border-radius:999px;background:var(--text);color:#2a1020;font-size:13px;font-weight:600;box-shadow:0 10px 30px #0006;pointer-events:none}
#result{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:#0b060ab8;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}#result .card{width:min(420px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow-y:auto;padding:26px 24px 22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px #0009;text-align:center}#result .eyebrow{margin:0;color:var(--muted);font-size:12px}
#grade{font-family:var(--story);font-weight:700;font-size:76px;line-height:1.1;margin:6px 0 0}#grade.S{color:#ffd27a}#grade.A{color:var(--love)}#grade.B{color:var(--calm)}#grade.C{color:var(--muted)}#score{font-size:12px;color:var(--muted);margin:0 0 14px;font-variant-numeric:tabular-nums}#resultLine{font-family:var(--story);font-size:15px;line-height:1.6;margin:0 0 16px}
#resultStats{display:grid;grid-template-columns:1fr auto;gap:7px 16px;margin:0 0 14px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;text-align:left}#resultStats dt{color:var(--muted)}#resultStats dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}#resultAffection{font-size:13px;color:var(--accent);margin:0 0 18px}#result .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}#result .primary{min-height:40px;padding:0 22px}
.welcome-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.big{min-height:50px;padding:0 22px;font-size:13px;border-radius:28px}#profileLine{margin:14px 0 0;font-size:12px;color:var(--muted)}
#advancedBox{margin:18px 0 6px;border-top:1px solid var(--line);padding-top:12px}#advancedBox summary{cursor:pointer;font-size:13px;font-weight:600;padding:4px 0}
.pop.info{background:#2a2030;color:var(--text);border:1px solid var(--line)}.pop.gold{background:#ffd27a;color:#3a2410}
@media(max-width:899px){#toolbar{left:16px;right:16px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom));grid-template-columns:repeat(4,1fr);gap:6px}.tbtn{font-size:11px;padding:0 4px;min-height:38px;gap:4px}footer.playing{display:none}}
</style>
<script>
// ━━━ 한국어 CONFIG: 이곳의 숫자만 바꾸면 효과를 조절할 수 있습니다. ━━━
const CONFIG = {
  // 레이어: tools/export-layers.cjs로 만든 이미지 폴더(manifest.json). 있으면 PSD보다 먼저 읽어 로딩이 빨라집니다. ''이면 항상 PSD.
  파일: { 레이어: './assets/layers/', PSD: './assets/riana.psd', 최대용량MB: 64 },
  // 좁은화면최소폭·좁은화면중심X: 세로로 긴 화면에서 양옆(팔 끝)을 잘라 캐릭터를 크게 보여줄 때의 최소 폭과 중심 (PSD px).
  화면: { 여백: 0.06, 최대해상도배율: 2, 디버그: false, 프레임반경: 16, 하단잘라내기: 8, 좁은화면최소폭: 620, 좁은화면중심X: 470 },
  숨쉬기: { 세기: 0.003, 주기: 3.8, 머리따라가기: 0.95 },
  // 양쪽 눈에 같은 PSD 픽셀 이동량을 적용합니다. 눈별 폭으로 계산하지 않습니다.
  시선: { 세기: 0.8, 반응속도: 7, 좌우범위: 1.8, 위범위: 0.35, 아래범위: 0.65, 흰자노출한도: 0.025 },
  깜빡임: { 사용: false, 최소간격: 2.6, 최대간격: 6, 시간: 0.18 },
  고개: { 각도: 1.05, 시차: 2.4, 반응속도: 7 },
  머리카락: { 세기: 0.8, 스프링: 28, 감쇠: 9, 살랑임: 0.25 },
  // 드래그: 손에 달라붙는 정도(1이면 손과 똑같이 따라옴). 미끄러짐: 손이 표면을 미끄러지는 속도(0에 가까울수록 꽉 잡은 느낌).
  // 최대끌림을 넘게 손을 움직였을 때만 접촉점이 손을 따라 이동합니다.
  눌림: { 세기: 13, 반경: 96, 드래그: 0.9, 최대끌림: 58, 스프링: 220, 감쇠: 26, 미끄러짐: 0.15, 문지름출렁: 0.9, 최대출렁: 32,
    // topwear 경계 안의 상대 좌표 (0~1). 캐릭터가 바뀌면 조절하세요.
    가슴중심: [{ x: 0.27, y: 0.41 }, { x: 0.72, y: 0.26 }], 가슴반경: 90, 가슴관성: 1.1,
    클릭탄성: 120, 가슴스프링: 58, 가슴감쇠: 4.8 },
  // 흥분도는 0~100. 가슴을 누르고(초당) 문지를수록(화면 1000px/초 기준) 오릅니다.
  // 다른부위: 흥분도가 높을 때 어깨·팔·허리를 만져도 오르는 양(초당).
  흥분: { 배율: 1, 터치: 4, 누르기: 4, 문지르기: 14, 다른부위: 1.5, 감소: 3, 감소대기: 1.8, 절정유지: 3.2, 여운: 40 },
  // 만족도는 0~100. 어깨·팔·허리를 적정속도(화면 px/초)로 주무르면 초당 상승만큼 오르고,
  // 거칠기한계보다 빠르면 오히려 내려갑니다. 가슴은 만족도를 올리지 않습니다.
  만족: { 배율: 1, 상승: 4, 감소: 1.2, 감소대기: 3, 적정속도: [110, 520], 거칠기한계: 950, 극락유지: 3, 여운: 75 },
  // 적정 구간 변화: 만족도·흥분도 100일 때 구간 중심이 움직이는 양(화면 px/초, +는 빠르게)과 폭 변화 비율(-0.3이면 30% 좁아짐).
  // 기본값: 만족할수록 근육이 풀려 더 세게(빠르게), 흥분할수록 예민해져 더 부드럽게(느리게) 원합니다.

// 부위 판정: 위에 그려지는 옷(가슴·허리)을 먼저, 그 아래 팔(어깨 포함)을 확인합니다.

function twitch(power){const p=power*CONFIG.반응.팔움찔;for(const arm of arms)arm.va+=arm.sign*p*(.55+Math.random()*.9);flinch.va+=p*.32;if(power>24)buzz(14);}
// 적정 구간은 만족도·흥분도에 따라 이동하고 좁아집니다. 거칠기한계도 같은 간격을 유지하며 따라갑니다.
function sweetZone(){
  const [baseLow,baseHigh]=CONFIG.만족.적정속도,change=CONFIG.구간변화,sat=satisfy/100,hot=heat;
  const center=(baseLow+baseHigh)/2+change.만족이동*sat+change.흥분이동*hot,half=(baseHigh-baseLow)/2*Math.max(.15,(1+change.만족폭*sat)*(1+change.흥분폭*hot));

// 손놀림 품질: 적정 속도면 1, 가만히 누르면 지압(0.5), 거칠기한계를 넘으면 0 아래(아픔).

function updateContact(q,dt){

  if(q.tool==='oil'&&!finished){const before=oil[key];oil[key]=Math.min(1,oil[key]+CONFIG.오일.바르기*dt);if(before<.05&&oil[key]>=.05&&!oilSpoken){oilSpoken=true;say('오일',true);}}

function updatePlay(dt){

        if(q.quality<0&&time-lastRough>2.4){lastRough=time;session.rough++;popup('너무 세요!','rough',q.screen);say('아픔',true);twitch(22);}
        if(q.quality>=.95){if((q.goodTime+=dt)>1.6){q.goodTime=0;popup(pick(GOOD),'calm',q.screen);}}else q.goodTime=0;}

  // 가슴을 만지는 동안 무작위로 팔이 움찔합니다. 흥분할수록 자주.
  for(const q of chestTouches)if(Math.random()<dt*CONFIG.반응.움찔빈도*(.5+2.4*heat)*(.3+Math.min(1,q.speed/700))*q.gain)twitch(12+22*heat);

  updateBodyFx(dt);

  while(nextNote<audioContext.currentTime+2){const chord=chords[Math.floor(noteIndex/8)%chords.length],frequency=chord[[0,2,1,3,2,1,3,2][noteIndex%8]]*(noteIndex%3===0?2:1);
    if(pad&&noteIndex%8===0){pad.oscillators[0].frequency.setTargetAtTime(chord[0],nextNote,.4);pad.oscillators[1].frequency.setTargetAtTime(chord[2]*1.004,nextNote,.4);}
    const notes=[[frequency,.075]];if(heat>.45&&noteIndex%2===0)notes.push([frequency*2,.03*heat]);
    for(const [f,v] of notes){const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=f;gain.gain.setValueAtTime(0,nextNote);gain.gain.linearRampToValueAtTime(v,nextNote+.15);gain.gain.exponentialRampToValueAtTime(.0001,nextNote+3.5);oscillator.connect(gain);gain.connect(master);oscillator.start(nextNote);oscillator.stop(nextNote+3.6);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};}
    nextNote+=.7-.25*heat;noteIndex++;}}
async function setMusic(on){if(on&&!audioContext){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('이 브라우저는 Web Audio를 지원하지 않습니다.');audioContext=new Audio();master=audioContext.createGain();master.gain.value=0;master.connect(audioContext.destination);}

  const children=await Promise.all(manifest.layers.map(async item=>{const image=new Image();image.src=folder+item.file;await image.decode();const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;canvas.getContext('2d',{willReadFrequently:true}).drawImage(image,0,0);$('progress').value=++done;
    return {name:item.name,left:item.left,top:item.top,right:item.left+canvas.width,bottom:item.top+canvas.height,opacity:item.opacity,hidden:item.hidden,canvas};}));

  const item=backgroundList().find(b=>b.이름===name)||CONFIG.배경.목록[0];if(!item)return;
  const css=backgroundCss(item);$('scene').style.background=item.이미지?css+' center/cover no-repeat':css;
  $('sceneBlur').style.backgroundImage=item.이미지?css:'none';$('sceneBlur').style.opacity=item.이미지?1:0;
  for(const button of $('bgList').children)button.setAttribute('aria-pressed',String(button.dataset.name===item.이름));
  if(remember&&!item.임시)try{localStorage.setItem('masa.background',item.이름);}catch{}
}
function createBackgroundList(){
  $('bgList').replaceChildren();
  for(const item of backgroundList()){const button=document.createElement('button'),swatch=document.createElement('i');button.type='button';button.className='bg-option'+(item.색==='transparent'&&!item.이미지?' none':'');button.dataset.name=item.이름;swatch.style.background=item.이미지?backgroundCss(item)+' center/cover':item.색;if(item.색==='transparent')swatch.style.background='';button.append(swatch,item.이름);button.addEventListener('click',()=>setBackground(item.이름));$('bgList').append(button);}
}
$('bgFile').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;if(uploadedBackground)URL.revokeObjectURL(uploadedBackground.이미지);uploadedBackground={이름:'내 이미지',이미지:URL.createObjectURL(file),임시:true};createBackgroundList();setBackground('내 이미지');event.target.value='';});
$('bgUpload').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();$('bgFile').click();}});
createBackgroundList();{let saved=null;try{saved=localStorage.getItem('masa.background');}catch{}const wanted=param('배경','bg')||saved;setBackground(wanted&&CONFIG.배경.목록.some(b=>b.이름===wanted)?wanted:CONFIG.배경.기본,false);}
$('debug').checked=CONFIG.화면.디버그;$('layers').hidden=!CONFIG.화면.디버그;$('debug').addEventListener('change',()=>{CONFIG.화면.디버그=$('debug').checked;$('layers').hidden=!$('debug').checked;});
$('reset').addEventListener('click',()=>{for(const group of Object.keys(DEFAULTS))Object.assign(CONFIG[group],structuredClone(DEFAULTS[group]));for(const r of records)r.enabled=!r.layer.hidden;createControls();updateSweetBand(true);createLayerControls();$('debug').checked=CONFIG.화면.디버그;$('layers').hidden=!CONFIG.화면.디버그;if(master&&musicOn)master.gain.setTargetAtTime(CONFIG.음악.음량,audioContext.currentTime,.1);if(psd){updateModel(0);updateMeter(true);app.render();}});
$('file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;if(file.size>CONFIG.파일.최대용량MB*1024*1024){$('errorText').textContent='PSD 파일이 용량 제한을 초과했습니다.';return;}await init(await file.arrayBuffer());});
document.querySelector('label[for=file]').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();$('file').click();}});
$('retry').addEventListener('click',()=>init());addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden){app?.stop();for(const q of presses)if(q.active){q.active=false;q.end=time;}audioContext?.suspend();}else{if(started){app?.start();if(musicOn)audioContext?.resume().then(()=>{nextNote=audioContext.currentTime+.05;});}}});
document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});document.addEventListener('wheel',event=>{if(event.ctrlKey||!event.target.closest('#panel,#bgPanel,#result'))event.preventDefault();},{passive:false});
if(reducedMotion){CONFIG.숨쉬기.세기*=.4;CONFIG.고개.각도*=.4;CONFIG.머리카락.살랑임*=.4;CONFIG.눌림.클릭탄성*=.4;CONFIG.카메라.클로즈업=false;for(const group of ['숨쉬기','고개','머리카락','눌림','카메라'])Object.assign(DEFAULTS[group],CONFIG[group]);}
createControls();updateProfileLine();init();
</script>
</body>
</html>
