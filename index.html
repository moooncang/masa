<style>

    절정: ['~~~~~~ッ♥!!', '흐아아앗…♥♥'] },

<body>
<main id="stage" aria-label="마우스와 터치에 반응하는 레이나 캐릭터"></main>
<div id="frame" hidden aria-hidden="true"></div>
<div id="heat" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div><div id="voice" aria-live="polite"></div>
<header><div><h1>레이나</h1><p>조용히, 당신의 곁에</p></div><div class="tools">
<button class="tool" id="sound" aria-label="배경음악 켜기" aria-pressed="false" title="배경음악"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg></button>
<button class="tool" id="settings" aria-label="효과 설정 열기" aria-expanded="false" aria-controls="panel" title="효과 설정"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#191c24"/><circle cx="15" cy="17" r="3" fill="#191c24"/></svg></button>
</div></header>
<div id="loading" role="status">레이나를 불러오는 중<progress id="progress"></progress></div>
<div id="message" hidden role="alert"><strong>캐릭터를 불러오지 못했어요</strong><p id="errorText"></p><label for="file" tabindex="0">PSD 파일 선택</label><input type="file" id="file" accept=".psd"><p>파일은 이 브라우저에서만 읽습니다.</p><button class="secondary" id="retry">다시 불러오기</button></div>
<div id="welcome"><p id="intro">레이나의 마사지 시간이에요.</p><button id="start" class="primary" disabled>불러오는 중…</button></div>
<footer id="hint"><div id="meter" hidden role="meter" aria-label="레이나의 흥분도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="meter-top"><span id="meterHeart"><svg viewBox="0 0 24 24"><path d="M12 21C5 15.5 2 12 2 8.2 2 5.3 4.3 3 7.1 3c2 0 3.6 1 4.9 2.8C13.3 4 14.9 3 16.9 3 19.7 3 22 5.3 22 8.2c0 3.8-3 7.3-10 12.8z"/></svg></span><span>흥분도</span><span id="stageLabel">평온</span><output id="arousalValue">0%</output></div><div class="meter-bar"><i id="arousalFill"></i></div></div><div id="hintMain">마우스를 움직여 눈을 맞춰보세요</div><div class="sub">가슴을 누르거나 문질러보세요</div></footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const DEFAULTS = structuredClone(CONFIG);
const TOP_ORDER = ['front hair','irides-l','irides-r','eyewhite-l','eyewhite-r','eyelash-l','eyelash-r','eyebrow-r','topwear','mouth','eyebrow-l','nose','face','handwear-l','tail','ears-l','handwear-r','ears-r','neck','back hair'];
const BODY = new Set(['neck','topwear','handwear-l','handwear-r']);
const HAIR = new Set(['front hair','back hair','tail']);
const BACK = new Set(['back hair','tail']);
const HEAD = new Set(['face','blush','ears-l','ears-r','eyewhite-l','eyewhite-r','irides-l','irides-r','eyelash-l','eyelash-r','eyebrow-l','eyebrow-r','nose','mouth','front hair']);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const lerp = (a,b,t) => a+(b-a)*t;
let app,world,frameMask,psd,records=[],byName=new Map(),masks=[],started=false,loading=false,loadSequence=0;
let time=0,head={x:0,y:0,vx:0,vy:0},gaze={x:0,y:0},eyeShift={x:0,y:0},pointer={x:0,y:0},nextBlink=3,blinkStart=-100;
let bounds={left:0,top:0,right:1024,bottom:1024},anchor={x:512,y:410};
let press=null,pressSpring={x:0,y:0,z:0,vx:0,vy:0,vz:0},chest=[];
let audioContext,master,musicOn=false,musicTimer,nextNote=0,noteIndex=0;
// 반응 상태: 흥분도(0~100), 화면용 부드러운 값(heat 0~1), 팔·몸 움찔 스프링, 하트 파티클.
let arousal=0,heat=0,touchLevel=0,idle=0,climax=0,climaxTimer=0,shiver=0,breathPhase=0,stageIndex=0;
let arms=[],flinch={a:0,va:0},fx,heartTex,glowTex,glow,hearts=[],sfxGain,nextBeat=0,lastVoice=-100,lastLine='',cursorScreen={x:0,y:0};
const STAGES=[['평온','평온'],['두근','두근두근'],['달아오름','달아오름'],['한계','한계 직전'],['절정','절정♥']];
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

function loadScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');const fail=()=>{clearTimeout(timer);s.remove();reject(new Error('라이브러리 CDN 연결을 확인한 뒤 다시 불러오기를 눌러주세요.'));};const timer=setTimeout(fail,20000);s.src=url;s.onload=()=>{clearTimeout(timer);resolve();};s.onerror=fail;document.head.appendChild(s);});}
let libraries;
function ensureLibraries(){return libraries||=(Promise.all([
  window.PIXI?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js'),
  window.agPsd?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/ag-psd@27.0.0/dist/bundle.js')
]).catch(error=>{libraries=null;throw error;}));}

function spring(state,key,target,k,d,dt){const velocity='v'+key;state[velocity]+=(k*(target-state[key])-d*state[velocity])*dt;state[key]+=state[velocity]*dt;}
function clearModel(){if(!world)return;for(const r of records)r.mesh.mask=null;world.removeChildren().forEach(c=>c.destroy({children:true,texture:false,baseTexture:false}));for(const m of masks)m.texture.destroy(true);for(const r of records)r.texture.destroy(true);records=[];byName.clear();masks=[];press=null;chest=[];}
function flatten(children,result=[]){for(const layer of children||[]){if(layer.children)flatten(layer.children,result);else if(layer.canvas?.width&&layer.canvas?.height)result.push(layer);}return result;}

function buildModel(documentPSD){
  clearModel();psd=documentPSD;
  // ag-psd children은 아래→위 순서. 일반 레이어의 자리는 그대로 두고 눈 자리만 교환합니다.
  const layers=flatten(psd.children);
  const eyeIndices=layers.map((l,i)=>/^(eyewhite|irides|eyelash)-[lr]$/.test(l.name.trim().toLowerCase())?i:-1).filter(i=>i>=0);
  const rank=name=>name.startsWith('eyewhite')?0:name.startsWith('irides')?1:2;
  const eyeLayers=eyeIndices.map(i=>layers[i]).sort((a,b)=>rank(a.name)-rank(b.name));
  eyeIndices.forEach((slot,i)=>layers[slot]=eyeLayers[i]);
  for(const layer of layers)addRecord(layer.name.trim().toLowerCase(),layer,layer.canvas);
  if(!records.length)throw new Error('표시할 이미지 레이어가 없는 PSD입니다.');
  bounds={left:Math.min(...records.map(r=>r.layer.left)),top:Math.min(...records.map(r=>r.layer.top)),right:Math.max(...records.map(r=>r.layer.right)),bottom:Math.max(...records.map(r=>r.layer.bottom))};
  // 홍조는 face와 같은 메쉬를 쓰는 오버레이입니다. face 바로 위(코·눈 아래)에 놓아 고개와 함께 움직입니다.
  const faceRecord=byName.get('face');
  if(faceRecord){const blush=addRecord('blush',faceRecord.layer,blushCanvas(faceRecord),world.getChildIndex(faceRecord.mesh)+1);blush.overlay=true;blush.mesh.alpha=0;}
  // 팔은 어깨를 고정한 채 회전합니다. sign은 손이 위로 올라가는(움찔) 방향입니다.
  arms=[['handwear-l',-1],['handwear-r',1]].map(([name,sign])=>{const r=byName.get(name);if(!r)return null;const l=r.layer;r.arm={px:sign<0?l.left+40:l.right-40,py:l.top+42,sign,a:0,va:0,seed:Math.random()*9};return r.arm;}).filter(Boolean);
  glow=new PIXI.Sprite(glowTex);glow.anchor.set(.5);glow.alpha=0;glow.eventMode='none';world.addChild(glow);
  const face=byName.get('face')?.layer;
  anchor={x:face?(face.left+face.right)/2:psd.width/2,y:face?face.bottom-18:psd.height*.4};
  for(const side of ['l','r']){
    const white=byName.get('eyewhite-'+side),iris=byName.get('irides-'+side);
    if(!white||!iris)continue;
    // SpriteMaskFilter는 실제 흰자 alpha를 사용합니다. 사각형 근사 마스크가 아닙니다.
    const maskCanvas=document.createElement('canvas');maskCanvas.width=white.pixels.width;maskCanvas.height=white.pixels.height;
    const alpha=new ImageData(new Uint8ClampedArray(white.pixels.data),white.pixels.width,white.pixels.height);
    for(let i=0;i<alpha.data.length;i+=4)alpha.data[i]=alpha.data[i+1]=alpha.data[i+2]=255;
    maskCanvas.getContext('2d').putImageData(alpha,0,0);

  definitions.splice(3,0,['시선','좌우범위','눈동자 좌우 범위 (px)',0,3,.1],['시선','위범위','눈동자 위쪽 범위 (px)',0,.8,.05],['시선','아래범위','눈동자 아래쪽 범위 (px)',0,1,.05]);
  for(let i=definitions.length-1;i>=0;i--)if(definitions[i][0]==='깜빡임')definitions.splice(i,1);
  definitions.unshift(['흥분','배율','흥분 상승 배율',0,3,.1],['흥분','감소','흥분 감소 속도',0,10,.5],['반응','팔움찔','팔 움찔 세기',0,2.5,.1],['반응','움찔빈도','팔 움찔 빈도',0,3,.1],['반응','눈감기','눈 풀림',0,.6,.02],['반응','입벌림','숨 몰아쉬기 (입)',0,1,.05],['반응','홍조','홍조 세기',0,1.5,.05],['하트','양','하트 양',0,3,.1],['눌림','미끄러짐','문지름 미끄러짐',0,8,.25],['눌림','문지름출렁','문지름 출렁임',0,3,.1],['효과음','음량','심장 소리',0,1,.05]);
  definitions.splice(definitions.length-1,0,['눌림','클릭탄성','클릭 출렁임',0,180,5],['눌림','가슴스프링','출렁임 탄성',30,100,2],['눌림','가슴감쇠','출렁임 감쇠',3,12,.2]);
  $('controls').replaceChildren();for(const [group,key,title,min,max,step] of definitions){const label=document.createElement('label');label.className='setting';const span=document.createElement('span'),text=document.createElement('span'),output=document.createElement('output'),input=document.createElement('input');text.textContent=title;output.value=CONFIG[group][key];input.type='range';input.min=min;input.max=max;input.step=step;input.value=CONFIG[group][key];input.id=`control-${group}-${key}`;output.htmlFor=input.id;span.append(text,output);label.append(span,input);input.addEventListener('input',()=>{CONFIG[group][key]=Number(input.value);output.value=input.value;if(group==='깜빡임')nextBlink=time+randomBlink();if(group==='음악'&&master&&musicOn)master.gain.setTargetAtTime(CONFIG.음악.음량,audioContext.currentTime,.1);});$('controls').append(label);}
}
function createLayerControls(){$('layers').replaceChildren();for(const r of records.filter(r=>!r.overlay).reverse()){const row=document.createElement('div');row.className='row';const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span'),coords=document.createElement('small');input.type='checkbox';input.checked=r.enabled;text.textContent=r.name;coords.textContent=`${r.layer.left}, ${r.layer.top}`;label.append(input,text);row.append(label,coords);input.addEventListener('change',()=>{r.enabled=input.checked;r.mesh.visible=r.enabled;if(!started)app.render();});$('layers').append(row);}}
$('start').addEventListener('click',startExperience);$('sound').addEventListener('click',()=>{if(!started){startExperience();return;}setMusic(!musicOn).catch(error=>{$('stats').textContent=error.message;});});
$('settings').addEventListener('click',()=>{const show=$('panel').hidden;$('panel').hidden=!show;$('settings').setAttribute('aria-expanded',String(show));$('settings').setAttribute('aria-label',show?'효과 설정 닫기':'효과 설정 열기');});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){$('panel').hidden=true;$('settings').setAttribute('aria-expanded','false');$('settings').focus();}});
$('debug').checked=CONFIG.화면.디버그;$('layers').hidden=!CONFIG.화면.디버그;$('debug').addEventListener('change',()=>{CONFIG.화면.디버그=$('debug').checked;$('layers').hidden=!$('debug').checked;});
$('reset').addEventListener('click',()=>{for(const group of Object.keys(DEFAULTS))Object.assign(CONFIG[group],structuredClone(DEFAULTS[group]));for(const r of records)r.enabled=!r.layer.hidden;arousal=heat=0;climax=0;stageIndex=0;createControls();createLayerControls();nextBlink=time+randomBlink();$('debug').checked=CONFIG.화면.디버그;$('layers').hidden=!CONFIG.화면.디버그;if(master&&musicOn)master.gain.setTargetAtTime(CONFIG.음악.음량,audioContext.currentTime,.1);if(psd){updateModel(0);updateMeter(true);app.render();}});
$('file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;if(file.size>CONFIG.파일.최대용량MB*1024*1024){$('errorText').textContent='PSD 파일이 용량 제한을 초과했습니다.';return;}await init(await file.arrayBuffer());});
document.querySelector('label[for=file]').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();$('file').click();}});
$('retry').addEventListener('click',()=>init());addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden){app?.stop();if(press)press.active=false;audioContext?.suspend();}else{if(started){app?.start();if(musicOn)audioContext?.resume().then(()=>{nextNote=audioContext.currentTime+.05;});}}});
document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});document.addEventListener('wheel',event=>{if(event.ctrlKey||!event.target.closest('#panel'))event.preventDefault();},{passive:false});
if(reducedMotion){CONFIG.숨쉬기.세기*=.4;CONFIG.고개.각도*=.4;CONFIG.머리카락.살랑임*=.4;CONFIG.눌림.클릭탄성*=.4;for(const group of ['숨쉬기','고개','머리카락','눌림'])Object.assign(DEFAULTS[group],CONFIG[group]);}
createControls();init();
</script>
</body>
</html>
