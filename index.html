<style>
:root{color-scheme:dark;--bg:#13151b;--panel:#20232b;--text:#f0ede8;--muted:#b3b5c1;--line:#393d49;--accent:#d6bb91;font-family:"Segoe UI","Malgun Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text)}
body{user-select:none;-webkit-user-select:none}button,input{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:5px}::selection{background:var(--accent);color:var(--bg)}

#frame{position:absolute;z-index:1;border:1px solid #8b7c6459;border-radius:16px;pointer-events:none;overflow:hidden;box-shadow:inset 0 0 0 4px #13151b44}#frame::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(transparent,#13151b99)}
header{position:absolute;z-index:2;top:calc(26px + env(safe-area-inset-top));left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}h1{font-family:Georgia,"Batang",serif;font-weight:400;font-size:25px;margin:0;letter-spacing:.08em}header p{margin:7px 0 0;color:var(--muted);font-size:12px;letter-spacing:.1em}.tools{display:flex;gap:8px;pointer-events:auto}.tool{width:44px;height:44px;background:#191c24;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:background .2s,border-color .2s}.tool:hover,.tool[aria-pressed=true]{background:#30313a;border-color:var(--accent)}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
footer{position:absolute;z-index:2;bottom:calc(22px + env(safe-area-inset-bottom));left:24px;right:24px;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}footer span{display:block;margin-top:8px;color:#d6bb91;font-size:11px;letter-spacing:.1em}
#welcome{position:absolute;z-index:3;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;width:min(360px,90vw)}#welcome p{font-size:13px;color:var(--muted);margin:0 0 17px;line-height:1.7}.primary{background:var(--accent);color:#242028;border:0;border-radius:28px;min-height:50px;padding:0 32px;font-weight:600;box-shadow:0 8px 30px #0003;transition:background .2s,transform .2s}.primary:hover{background:#ead2ac;transform:translateY(-2px)}.primary:disabled{cursor:wait;opacity:.65;transform:none}
#message{position:absolute;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);max-width:90vw;width:360px;text-align:center;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}#message p{line-height:1.7;font-size:14px;color:var(--muted)}#message label{display:inline-block;padding:12px 20px;background:var(--accent);color:#242028;border-radius:24px;cursor:pointer}#file{position:absolute;width:1px;height:1px;opacity:0}#loading{position:absolute;z-index:2;top:48%;left:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:13px;text-align:center}progress{display:block;width:170px;height:3px;margin:15px auto;accent-color:var(--accent)}

@media(max-width:600px){header{left:20px;right:20px;top:calc(18px + env(safe-area-inset-top))}h1{font-size:21px}header p{font-size:11px}.tool{width:40px;height:40px}#panel{right:16px}footer{font-size:11px;bottom:calc(18px + env(safe-area-inset-bottom))}#welcome{bottom:calc(82px + env(safe-area-inset-bottom))}}

<script>
// ━━━ 한국어 CONFIG: 이곳의 숫자만 바꾸면 효과를 조절할 수 있습니다. ━━━
const CONFIG = {
  파일: { PSD: './assets/riana.psd', 최대용량MB: 64 },
  화면: { 여백: 0.06, 최대해상도배율: 2, 디버그: false, 프레임반경: 16, 하단잘라내기: 8 },
  숨쉬기: { 세기: 0.003, 주기: 3.8, 머리따라가기: 0.95 },
  // 양쪽 눈에 같은 PSD 픽셀 이동량을 적용합니다. 눈별 폭으로 계산하지 않습니다.
  시선: { 세기: 0.8, 반응속도: 7, 좌우범위: 1.8, 위범위: 0.35, 아래범위: 0.65, 흰자노출한도: 0.025 },
  깜빡임: { 사용: false, 최소간격: 2.6, 최대간격: 6, 시간: 0.18 },
  고개: { 각도: 1.05, 시차: 2.4, 반응속도: 7 },
  머리카락: { 세기: 0.8, 스프링: 28, 감쇠: 9, 살랑임: 0.25 },
  눌림: { 세기: 10, 반경: 72, 드래그: 0.3, 최대끌림: 38, 스프링: 105, 감쇠: 13,
    // topwear 경계 안의 상대 좌표 (0~1). 캐릭터가 바뀌면 조절하세요.
    가슴중심: [{ x: 0.27, y: 0.41 }, { x: 0.72, y: 0.26 }], 가슴반경: 90, 가슴관성: 0.9,
    클릭탄성: 110, 가슴스프링: 58, 가슴감쇠: 4.8 },
  음악: { 음량: 0.32 },
};
</script>

<body>

<div id="frame" hidden aria-hidden="true"></div>
<header><div><h1>리아나</h1><p>조용히, 당신의 곁에</p></div><div class="tools">

<script>
'use strict';
const $ = id => document.getElementById(id);
const DEFAULTS = structuredClone(CONFIG);
const TOP_ORDER = ['front hair','irides-l','irides-r','eyewhite-l','eyewhite-r','eyelash-l','eyelash-r','eyebrow-r','topwear','mouth','eyebrow-l','nose','face','handwear-l','tail','ears-l','handwear-r','ears-r','neck','back hair'];
const BODY = new Set(['neck','topwear','handwear-l','handwear-r']);
const HAIR = new Set(['front hair','back hair','tail']);
const BACK = new Set(['back hair','tail']);
const HEAD = new Set(['face','ears-l','ears-r','eyewhite-l','eyewhite-r','irides-l','irides-r','eyelash-l','eyelash-r','eyebrow-l','eyebrow-r','nose','mouth','front hair']);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const lerp = (a,b,t) => a+(b-a)*t;
let app,world,frameMask,psd,records=[],byName=new Map(),masks=[],started=false,loading=false,loadSequence=0;
let time=0,head={x:0,y:0,vx:0,vy:0},gaze={x:0,y:0},eyeShift={x:0,y:0},pointer={x:0,y:0},nextBlink=3,blinkStart=-100;
let bounds={left:0,top:0,right:1024,bottom:1024},anchor={x:512,y:410};
let press=null,pressSpring={x:0,y:0,z:0,vx:0,vy:0,vz:0},chest=[];
let audioContext,master,musicOn=false,musicTimer,nextNote=0,noteIndex=0;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

function loadScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');const fail=()=>{clearTimeout(timer);s.remove();reject(new Error('라이브러리 CDN 연결을 확인한 뒤 다시 불러오기를 눌러주세요.'));};const timer=setTimeout(fail,20000);s.src=url;s.onload=()=>{clearTimeout(timer);resolve();};s.onerror=fail;document.head.appendChild(s);});}
let libraries;
function ensureLibraries(){return libraries||=(Promise.all([
  window.PIXI?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js'),
  window.agPsd?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/ag-psd@27.0.0/dist/bundle.js')
]).catch(error=>{libraries=null;throw error;}));}

function spring(state,key,target,k,d,dt){const velocity='v'+key;state[velocity]+=(k*(target-state[key])-d*state[velocity])*dt;state[key]+=state[velocity]*dt;}
function clearModel(){if(!world)return;for(const r of records)r.mesh.mask=null;world.removeChildren().forEach(c=>c.destroy({children:true,texture:false,baseTexture:false}));for(const m of masks)m.texture.destroy(true);for(const r of records)r.texture.destroy(true);records=[];byName.clear();masks=[];press=null;chest=[];}
function flatten(children,result=[]){for(const layer of children||[]){if(layer.children)flatten(layer.children,result);else if(layer.canvas?.width&&layer.canvas?.height)result.push(layer);}return result;}

function buildModel(documentPSD){
  clearModel();psd=documentPSD;
  // ag-psd children은 아래→위 순서. 일반 레이어의 자리는 그대로 두고 눈 자리만 교환합니다.
  const layers=flatten(psd.children);
  const eyeIndices=layers.map((l,i)=>/^(eyewhite|irides|eyelash)-[lr]$/.test(l.name.trim().toLowerCase())?i:-1).filter(i=>i>=0);
  const rank=name=>name.startsWith('eyewhite')?0:name.startsWith('irides')?1:2;
  const eyeLayers=eyeIndices.map(i=>layers[i]).sort((a,b)=>rank(a.name)-rank(b.name));
  eyeIndices.forEach((slot,i)=>layers[slot]=eyeLayers[i]);
  for(const layer of layers){
    const name=layer.name.trim().toLowerCase(),texture=PIXI.Texture.from(layer.canvas);
    const columns=name==='topwear'?35:HAIR.has(name)?17:BODY.has(name)?11:5;
    const rows=name==='topwear'?39:HAIR.has(name)?27:BODY.has(name)?13:5;
    const mesh=new PIXI.SimplePlane(texture,columns,rows);
    // 정점은 원본 PSD 좌표로 이동하고 텍스처 UV는 그대로 유지합니다.
    const buffer=mesh.geometry.getBuffer('aVertexPosition'),base=new Float32Array(buffer.data.length);
    for(let i=0;i<base.length;i+=2){base[i]=buffer.data[i]+(layer.left||0);base[i+1]=buffer.data[i+1]+(layer.top||0);}
    buffer.data.set(base);buffer.update();mesh.autoResize=false;mesh.alpha=layer.opacity??1;mesh.visible=!layer.hidden;mesh.eventMode='none';world.addChild(mesh);
    const pixels=layer.canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,layer.canvas.width,layer.canvas.height);
    const record={name,layer,texture,mesh,buffer,base,pixels,enabled:!layer.hidden,hair:{x:0,y:0,vx:0,vy:0}};
    records.push(record);byName.set(name,record);
  }
  if(!records.length)throw new Error('표시할 이미지 레이어가 없는 PSD입니다.');
  bounds={left:Math.min(...records.map(r=>r.layer.left)),top:Math.min(...records.map(r=>r.layer.top)),right:Math.max(...records.map(r=>r.layer.right)),bottom:Math.max(...records.map(r=>r.layer.bottom))};
  const face=byName.get('face')?.layer;
  anchor={x:face?(face.left+face.right)/2:psd.width/2,y:face?face.bottom-18:psd.height*.4};
  for(const side of ['l','r']){
    const white=byName.get('eyewhite-'+side),iris=byName.get('irides-'+side);
    if(!white||!iris)continue;
    // SpriteMaskFilter는 실제 흰자 alpha를 사용합니다. 사각형 근사 마스크가 아닙니다.
    const maskCanvas=document.createElement('canvas');maskCanvas.width=white.pixels.width;maskCanvas.height=white.pixels.height;
    const alpha=new ImageData(new Uint8ClampedArray(white.pixels.data),white.pixels.width,white.pixels.height);
    for(let i=0;i<alpha.data.length;i+=4)alpha.data[i]=alpha.data[i+1]=alpha.data[i+2]=255;
    maskCanvas.getContext('2d').putImageData(alpha,0,0);
    const texture=PIXI.Texture.from(maskCanvas),mask=new PIXI.Sprite(texture);world.addChild(mask);iris.mesh.mask=mask;
    const calibration={sprite:mask,texture,white,iris,side,samples:[]};
    for(let y=0;y<white.pixels.height;y++)for(let x=0;x<white.pixels.width;x++){
      const a=white.pixels.data[(y*white.pixels.width+x)*4+3]/255;
      if(a>.15){const px=white.layer.left+x-iris.layer.left,py=white.layer.top+y-iris.layer.top;calibration.samples.push({x:px,y:py,a,baseline:sampleAlpha(iris.pixels,px,py)});}
    }
    calibration.rig=eyeRig(calibration.samples,iris.layer);
    white.eyeRig=iris.eyeRig=calibration.rig;const lash=byName.get('eyelash-'+side);if(lash){
      lash.eyeRig=calibration.rig;let sum=0,total=0;for(let y=0;y<lash.pixels.height;y++)for(let x=0;x<lash.pixels.width;x++){
        const a=lash.pixels.data[(y*lash.pixels.width+x)*4+3]/255;sum+=a*((lash.layer.left+x-calibration.rig.x)*calibration.rig.nx+(lash.layer.top+y-calibration.rig.y)*calibration.rig.ny);total+=a;
      }lash.lashNormal=sum/Math.max(1,total);
    }
    masks.push(calibration);
  }
  const top=byName.get('topwear')?.layer;
  chest=top?CONFIG.눌림.가슴중심.map(p=>({cx:top.left+(top.right-top.left)*p.x,cy:top.top+(top.bottom-top.top)*p.y,x:0,y:0,vx:0,vy:0})):[];
  time=0;nextBlink=randomBlink();blinkStart=-100;head={x:0,y:0,vx:0,vy:0};gaze={x:0,y:0};eyeShift={x:0,y:0};pressSpring={x:0,y:0,z:0,vx:0,vy:0,vz:0};
  resize();createLayerControls();updateModel(0);app.render();
  const missing=TOP_ORDER.filter(n=>!byName.has(n));
  $('stats').textContent=`${records.length}개 레이어 · ${psd.width} × ${psd.height}${missing.length?' · 누락: '+missing.join(', '):''}`;
  window.character={config:CONFIG,app,world,records,byName,masks,chest,get eyeShift(){return {...eyeShift};},get started(){return started;},get press(){return press;},get time(){return time;},get blink(){return blinkValue();}};
}
function resize(){
  if(!app||!psd)return;const width=innerWidth,height=innerHeight;app.renderer.resize(width,height);
  const gap=width<600?100:105,bottom=started?76:160,availableH=Math.max(100,height-gap-bottom);
  const crop={left:bounds.left-18,top:bounds.top-24,right:bounds.right+18,bottom:bounds.bottom-CONFIG.화면.하단잘라내기};
  const scale=Math.min(width*(1-CONFIG.화면.여백*2)/(crop.right-crop.left),availableH/(crop.bottom-crop.top));
  world.scale.set(scale);world.position.set(width/2-(crop.left+crop.right)/2*scale,gap+availableH/2-(crop.top+crop.bottom)/2*scale);
  const p=world.toGlobal(new PIXI.Point(crop.left,crop.top)),w=(crop.right-crop.left)*scale,h=(crop.bottom-crop.top)*scale;
  frameMask.clear().beginFill(0xffffff).drawRoundedRect(p.x,p.y,w,h,CONFIG.화면.프레임반경).endFill();world.mask=frameMask;
  Object.assign($('frame').style,{left:p.x+'px',top:p.y+'px',width:w+'px',height:h+'px',borderRadius:CONFIG.화면.프레임반경+'px'});$('frame').hidden=false;
  app.render();
}
function randomBlink(){const a=Math.max(.2,CONFIG.깜빡임.최소간격),b=Math.max(a,CONFIG.깜빡임.최대간격);return a+Math.random()*(b-a);}
function blinkValue(){if(!CONFIG.깜빡임.사용)return 0;const phase=(time-blinkStart)/Math.max(.05,CONFIG.깜빡임.시간);if(phase<0||phase>=1)return 0;return phase<.4?smoothstep(0,.4,phase):1-smoothstep(.4,1,phase);}
function headPoint(x,y,angle,dx,dy){const c=Math.cos(angle),s=Math.sin(angle);return {x:anchor.x+(x-anchor.x)*c-(y-anchor.y)*s+dx,y:anchor.y+(x-anchor.x)*s+(y-anchor.y)*c+dy};}
function groupTransform(name,breath){const factor=name==='front hair'?1.12:BACK.has(name)?.8:1;return {angle:head.x*CONFIG.고개.각도*Math.PI/180,dx:head.x*CONFIG.고개.시차*factor,dy:breath*CONFIG.숨쉬기.머리따라가기+head.y*CONFIG.고개.시차*.18*factor};}
function sampleAlpha(image,x,y){const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;const a=(px,py)=>px<0||py<0||px>=image.width||py>=image.height?0:image.data[(py*image.width+px)*4+3]/255;return lerp(lerp(a(x0,y0),a(x0+1,y0),fx),lerp(a(x0,y0+1),a(x0+1,y0+1),fx),fy);}
function eyeRig(samples,layer){
  let total=0,cx=0,cy=0;for(const p of samples){total+=p.a;cx+=p.x*p.a;cy+=p.y*p.a;}cx/=Math.max(1,total);cy/=Math.max(1,total);
  let xx=0,yy=0,xy=0;for(const p of samples){xx+=(p.x-cx)**2*p.a;yy+=(p.y-cy)**2*p.a;xy+=(p.x-cx)*(p.y-cy)*p.a;}
  const angle=.5*Math.atan2(2*xy,xx-yy),nx=-Math.sin(angle),ny=Math.cos(angle);
  const bottom=Math.max(0,...samples.filter(p=>p.a>.5).map(p=>(p.x-cx)*nx+(p.y-cy)*ny))*.8;
  return {x:layer.left+cx+nx*bottom,y:layer.top+cy+ny*bottom,nx,ny};
}

function updateModel(dt){

    spring(pressSpring,'y',press?.active?press.dy*press.gain:0,CONFIG.눌림.스프링,CONFIG.눌림.감쇠,step);
    spring(pressSpring,'z',press?.active?press.gain:0,CONFIG.눌림.스프링,CONFIG.눌림.감쇠,step);
    for(const r of records)if(HAIR.has(r.name)){
      const stiffness=r.name==='front hair'?1.3:r.name==='tail'?.7:1;
      spring(r.hair,'x',head.x,CONFIG.머리카락.스프링*stiffness,CONFIG.머리카락.감쇠,step);
      spring(r.hair,'y',head.y,CONFIG.머리카락.스프링*stiffness,CONFIG.머리카락.감쇠,step);
    }
    for(const c of chest){const influence=press?Math.exp(-((c.cx-press.x)**2+(c.cy-press.y)**2)/(CONFIG.눌림.가슴반경**2*2))*press.gain:0;
      spring(c,'x',pressSpring.x*influence*CONFIG.눌림.가슴관성,CONFIG.눌림.가슴스프링,CONFIG.눌림.가슴감쇠,step);

    for(let i=0;i<base.length;i+=2){let x=base[i],y=base[i+1];
      if(BODY.has(name)){y=bounds.bottom+(y-bounds.bottom)*breathScale;x+=head.x*.5*(1-smoothstep(anchor.y,bounds.bottom,y));}
      if(name==='neck'){
        const blend=1-smoothstep(layer.top,layer.bottom,base[i+1]);const p=headPoint(base[i],base[i+1],transform.angle,transform.dx,transform.dy);x=lerp(x,p.x,blend);y=lerp(y,p.y,blend);

      }

}

function modelPoint(event){const rect=app.view.getBoundingClientRect();return world.toLocal(new PIXI.Point((event.clientX-rect.left)*app.screen.width/rect.width,(event.clientY-rect.top)*app.screen.height/rect.height));}

// 실제로 변형된 mesh의 삼각형과 UV로 알파 히트테스트: 투명한 부분은 눌리지 않습니다.

$('reset').addEventListener('click',()=>{for(const group of Object.keys(DEFAULTS))Object.assign(CONFIG[group],structuredClone(DEFAULTS[group]));for(const r of records)r.enabled=!r.layer.hidden;createControls();createLayerControls();nextBlink=time+randomBlink();$('debug').checked=CONFIG.화면.디버그;$('layers').hidden=!CONFIG.화면.디버그;if(master&&musicOn)master.gain.setTargetAtTime(CONFIG.음악.음량,audioContext.currentTime,.1);if(psd){updateModel(0);app.render();}});
$('file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;if(file.size>CONFIG.파일.최대용량MB*1024*1024){$('errorText').textContent='PSD 파일이 용량 제한을 초과했습니다.';return;}await init(await file.arrayBuffer());});
document.querySelector('label[for=file]').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();$('file').click();}});
$('retry').addEventListener('click',()=>init());addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden){app?.stop();if(press)press.active=false;audioContext?.suspend();}else{if(started){app?.start();if(musicOn)audioContext?.resume().then(()=>{nextNote=audioContext.currentTime+.05;});}}});
document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});document.addEventListener('wheel',event=>{if(event.ctrlKey||!event.target.closest('#panel'))event.preventDefault();},{passive:false});
if(reducedMotion){CONFIG.숨쉬기.세기*=.4;CONFIG.고개.각도*=.4;CONFIG.머리카락.살랑임*=.4;CONFIG.눌림.클릭탄성*=.4;for(const group of ['숨쉬기','고개','머리카락','눌림'])Object.assign(DEFAULTS[group],CONFIG[group]);}
createControls();init();
</script>
</body>
</html>
